<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>
  <body>
    <main>
      <div hidden class="menu" data-screen="menu">
        <form class="menu__form">
          <!-- player 1 name (visible at start) -->
          <div class="name-form" data-step="player1Name">
            <p class="name-form__title">Player name</p>
            <div class="name-form__field">
              <input
                type="text"
                name="player1Name"
                class="name-form__input"
                aria-label="Player 1 name"
                placeholder="Enter your name:"
              />
              <button
                type="button"
                class="name-form__submit"
                data-event="player1Submit"
                aria-label="Confirm name"
              ></button>
            </div>
          </div>
          <!-- Step 2: game mode (hidden until the name is confirmed) -->
          <div hidden class="menu__game-modes game-modes" data-step="mode">
            <p class="game-modes__title" id="game-modes-title">Game mode</p>
            <div
              class="game-modes__options"
              role="group"
              aria-labelledby="game-modes-title"
            >
              <button
                type="submit"
                class="game-modes__button"
                value="single"
                name="mode"
              >
                Single player
              </button>
              <button
                type="button"
                class="game-modes__button"
                data-event="multiChosen"
              >
                Multiplayer
              </button>
            </div>
          </div>
          <!-- Step 3: player 2 name (hidden until multiplayer is chosen) -->
          <div hidden class="name-form" data-step="player2Name">
            <p class="name-form__title">Player name</p>
            <div class="name-form__field">
              <input
                type="text"
                name="player2Name"
                class="name-form__input"
                aria-label="Player 2 name"
                placeholder="Enter player 2 name:"
              />
              <button
                type="submit"
                class="name-form__submit"
                aria-label="Start Game"
                value="multi"
              ></button>
            </div>
          </div>
        </form>
      </div>
      <div hidden class="ship-placement" data-screen="placement">
        <p class="ship-placement__title"></p>
        <div class="ship-placement__setup">
          <div class="fleet">
            <p class="fleet__title"></p>
            <div class="fleet__ships"></div>
            <div class="fleet__controls">
              <button type="button" data-action="rotate">Rotate</button>
              <button type="button" data-action="randomize">
                Randomize placement
              </button>
              <button type="button" data-action="confirmPlacement">
                Confirm placement
              </button>
            </div>
          </div>
          <div class="gameboard">
            <p class="gameboard__title">Your grid</p>
            <div class="gameboard__slot" data-board="placement"></div>
          </div>
        </div>
      </div>
      <div hidden class="game" data-screen="game">
        <div id="announcements">
          <p aria-live="polite" class="game-status"></p>
          <div hidden class="game-controls">
            <button type="button" class="game-controls__restart">
              Restart
            </button>
            <button type="button" class="game-controls__new-game">
              New game
            </button>
          </div>
        </div>
        <div class="gameboards">
          <div class="gameboard">
            <p class="gameboard__title">Your grid</p>
            <div class="gameboard__slot" data-board="player1"></div>
          </div>
          <div class="gameboard">
            <p class="gameboard__title">Opponent's grid</p>
            <div class="gameboard__slot" data-board="player2"></div>
          </div>
        </div>
      </div>
      <div
        hidden
        class="handoff-overlay"
        role="dialog"
        aria-modal="true"
        aria-labelledby="handoff-overlay__message"
      >
        <img
          class="handoff-overlay__image"
          src="assets/icons/radar.svg"
          alt=""
        />
        <p class="handoff-overlay__message"></p>
        <button class="handoff-overlay__button">Start turn!</button>
      </div>
    </main>
  </body>
</html>
